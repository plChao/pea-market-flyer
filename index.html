<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python 觀念題猜題</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1f2430;
    --muted: #6b7280;
    --border: #e3e5ea;
    --primary: #3b5bdb;
    --primary-dark: #2f4bc0;
    --correct: #2f9e44;
    --correct-bg: #ebfbee;
    --wrong: #e03131;
    --wrong-bg: #fff0f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 24px 16px 80px;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
  }
  header {
    text-align: center;
    margin-bottom: 28px;
  }
  header h1 {
    font-size: 1.6rem;
    margin: 0 0 6px;
  }
  header p {
    color: var(--muted);
    margin: 0;
    font-size: 0.95rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
    margin-bottom: 18px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .q-title {
    font-weight: 600;
    margin-bottom: 4px;
    display: flex;
    gap: 8px;
    align-items: baseline;
  }
  .q-num {
    color: var(--primary);
    font-weight: 700;
    flex-shrink: 0;
  }
  pre.code {
    background: #282c34;
    color: #e6e6e6;
    padding: 12px 14px;
    border-radius: 8px;
    overflow-x: auto;
    font-size: 0.88rem;
    margin: 10px 0 14px;
    font-family: "SFMono-Regular", Consolas, Menlo, monospace;
    white-space: pre;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    font-size: 0.95rem;
  }
  .option:hover {
    border-color: var(--primary);
  }
  .option input {
    margin-top: 3px;
    flex-shrink: 0;
  }
  .option.selected {
    border-color: var(--primary);
    background: #eef1ff;
  }
  .option.correct {
    border-color: var(--correct);
    background: var(--correct-bg);
  }
  .option.wrong {
    border-color: var(--wrong);
    background: var(--wrong-bg);
  }
  .option code {
    background: rgba(0,0,0,0.06);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 0.88em;
  }
  .explain {
    display: none;
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 8px;
    background: #f8f9fb;
    border: 1px dashed var(--border);
    font-size: 0.92rem;
  }
  .explain.show { display: block; }
  .explain .tag {
    display: inline-block;
    font-size: 0.78rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 20px;
    margin-bottom: 8px;
  }
  .explain .tag.correct { background: var(--correct-bg); color: var(--correct); }
  .explain .tag.wrong { background: var(--wrong-bg); color: var(--wrong); }
  fieldset { border: none; padding: 0; margin: 0; }

  .actions {
    position: sticky;
    bottom: 16px;
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 20px;
  }
  button {
    font-size: 1rem;
    font-weight: 600;
    padding: 12px 28px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(59,91,219,0.3);
  }
  #submitBtn {
    background: var(--primary);
    color: #fff;
  }
  #submitBtn:hover { background: var(--primary-dark); }
  #retryBtn {
    background: #fff;
    color: var(--primary);
    border: 1px solid var(--primary);
    display: none;
    box-shadow: none;
  }
  #score {
    display: none;
    text-align: center;
    font-size: 1.15rem;
    font-weight: 700;
    margin: 0 0 18px;
    padding: 14px;
    border-radius: 10px;
    background: #eef1ff;
    color: var(--primary-dark);
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 32px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🐍 Python 觀念題猜題</h1>
    <p>共 8 題單選題，作答完畢後按「送出答案」查看詳解</p>
  </header>

  <div id="score"></div>

  <form id="quizForm"></form>

  <div class="actions">
    <button type="button" id="submitBtn">送出答案</button>
    <button type="button" id="retryBtn">重新作答</button>
  </div>

  <footer>Python 觀念小測驗 · 純靜態網頁，無需後端</footer>
</div>

<script>
const questions = [
  {
    title: "以下程式的執行結果為何？",
    code: `print(not True or False and True)`,
    options: ["True", "False", "None", "SyntaxError"],
    answer: 1,
    explain: `Python 運算子優先順序：<code>not</code> &gt; <code>and</code> &gt; <code>or</code>。<br>
      先算 <code>not True</code> → <code>False</code>；<br>
      再算 <code>False and True</code> → <code>False</code>（<code>and</code> 比 <code>or</code> 優先結合）；<br>
      最後 <code>False or False</code> → <code>False</code>。`
  },
  {
    title: "以下程式的執行結果為何？",
    code: `print(-7 // 2, -7 % 2)`,
    options: ["-3 -1", "-4 1", "-3 1", "-4 -1"],
    answer: 1,
    explain: `Python 的 <code>//</code> 是「向負無窮取整」（floor），不是無條件捨去。<br>
      <code>-7 / 2 = -3.5</code>，向下取整為 <code>-4</code>，所以 <code>-7 // 2 = -4</code>。<br>
      餘數公式為 <code>a - (a // b) * b</code>：<code>-7 - (-4 * 2) = -7 + 8 = 1</code>，所以 <code>-7 % 2 = 1</code>。<br>
      Python 的餘數符號一律跟「除數」相同（除數為正，餘數也為正）。`
  },
  {
    title: "以下程式的執行結果的型態為何？",
    code: `x = 4 / 2\nprint(type(x))`,
    options: ["&lt;class 'int'&gt;", "&lt;class 'float'&gt;", "&lt;class 'str'&gt;", "TypeError"],
    answer: 1,
    explain: `在 Python 3 中，<code>/</code>（真除法）不論是否整除，結果一律是 <code>float</code>。<br>
      例如 <code>4 / 2 = 2.0</code>，而不是 <code>2</code>。<br>
      如果要得到 <code>int</code> 結果，需使用整數除法 <code>//</code>（例如 <code>4 // 2 = 2</code>）。`
  },
  {
    title: "以下程式依序印出的結果為何？",
    code: `x = 1

def change():
    x = 2

def change_global():
    global x
    x = 2

change()
print(x)
change_global()
print(x)`,
    options: ["1  1", "1  2", "2  2", "2  1"],
    answer: 1,
    explain: `<code>change()</code> 內的 <code>x = 2</code> 會建立一個「區域變數」x，不會影響全域的 x，所以呼叫後 <code>print(x)</code> 仍是 <code>1</code>。<br>
      <code>change_global()</code> 內宣告了 <code>global x</code>，表示要修改的是全域變數 x，所以呼叫後全域 x 變成 <code>2</code>。<br>
      因此輸出依序為 <code>1</code> 和 <code>2</code>。`
  },
  {
    title: "以下程式執行後，a 的值為何？",
    code: `def modify(n):
    n = n + 1
    return n

a = 5
modify(a)
print(a)`,
    options: ["5", "6", "None", "Error"],
    answer: 0,
    explain: `<code>int</code> 是不可變（immutable）型態。<br>
      呼叫 <code>modify(a)</code> 時，參數 n 只是綁定到 a 目前的值 <code>5</code>；<br>
      函式內 <code>n = n + 1</code> 只是讓 n 這個名字重新指向一個新的整數物件 <code>6</code>，並不會改變外部變數 a 所指向的物件。<br>
      因此外部的 <code>a</code> 仍然是 <code>5</code>。`
  },
  {
    title: "以下程式執行後，a 的值為何？",
    code: `def modify(lst):
    lst.append(4)

a = [1, 2, 3]
modify(a)
print(a)`,
    options: ["[1, 2, 3]", "[1, 2, 3, 4]", "[4]", "Error"],
    answer: 1,
    explain: `<code>list</code> 是可變（mutable）型態。<br>
      呼叫 <code>modify(a)</code> 時，參數 lst 綁定到與 a 相同的 list 物件（傳的是參考）。<br>
      函式內 <code>lst.append(4)</code> 是「就地修改」該物件的內容，不是重新賦值，所以外部的 a 也會被改變。<br>
      因此結果為 <code>[1, 2, 3, 4]</code>。`
  },
  {
    title: "若使用者輸入 6，以下程式的輸出為何？",
    code: `n = input()
print(n * 3)`,
    options: ["18", "666", "6 6 6", "TypeError"],
    answer: 1,
    explain: `<code>input()</code> 的回傳值一律是「字串（str）」型態，即使使用者輸入的是數字字元。<br>
      所以 <code>n</code> 其實是字串 <code>'6'</code>，而字串乘以整數會重複該字串。<br>
      <code>'6' * 3</code> 結果是字串 <code>'666'</code>，<code>print</code> 印出時不會顯示引號，畫面上會看到 <code>666</code>。`
  },
  {
    title: "以下程式的執行結果為何？",
    code: `lst = [10, 20, 30, 40, 50]
print(lst[3:4])`,
    options: ["40", "[40]", "[30, 40]", "IndexError"],
    answer: 1,
    explain: `切片（slice）語法 <code>[start:stop]</code> 的結果「永遠是一個 list（子序列）」，即使裡面只有一個元素，也不會自動拆成單一值。<br>
      <code>lst[3:4]</code> 表示取索引 3（含）到索引 4（不含）之間的元素，也就是只有索引 3 的元素 <code>40</code>，但包裝成 list。<br>
      因此結果是 <code>[40]</code>，不是 <code>40</code>。若要取出單一值需用 <code>lst[3]</code>。`
  }
];

const form = document.getElementById('quizForm');
const scoreBox = document.getElementById('score');
const submitBtn = document.getElementById('submitBtn');
const retryBtn = document.getElementById('retryBtn');
const letters = ['A', 'B', 'C', 'D'];

function render() {
  form.innerHTML = '';
  questions.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.qi = qi;

    const titleDiv = document.createElement('div');
    titleDiv.className = 'q-title';
    titleDiv.innerHTML = `<span class="q-num">Q${qi + 1}.</span><span>${q.title}</span>`;
    card.appendChild(titleDiv);

    if (q.code) {
      const pre = document.createElement('pre');
      pre.className = 'code';
      pre.textContent = q.code;
      card.appendChild(pre);
    }

    const fieldset = document.createElement('fieldset');
    fieldset.className = 'options';
    q.options.forEach((opt, oi) => {
      const label = document.createElement('label');
      label.className = 'option';
      label.innerHTML = `<input type="radio" name="q${qi}" value="${oi}">
        <span>${letters[oi]}. ${opt}</span>`;
      fieldset.appendChild(label);
    });
    card.appendChild(fieldset);

    const explain = document.createElement('div');
    explain.className = 'explain';
    explain.dataset.qi = qi;
    card.appendChild(explain);

    form.appendChild(card);
  });
}

function grade() {
  let correctCount = 0;
  let allAnswered = true;

  questions.forEach((q, qi) => {
    const selected = form.querySelector(`input[name="q${qi}"]:checked`);
    const card = form.querySelector(`.card[data-qi="${qi}"]`);
    const labels = card.querySelectorAll('.option');
    const explain = card.querySelector('.explain');

    if (!selected) {
      allAnswered = false;
    }

    const selectedValue = selected ? parseInt(selected.value, 10) : -1;
    const isCorrect = selectedValue === q.answer;
    if (isCorrect) correctCount++;

    labels.forEach((label, oi) => {
      label.querySelector('input').disabled = true;
      if (oi === q.answer) {
        label.classList.add('correct');
      } else if (oi === selectedValue) {
        label.classList.add('wrong');
      }
    });

    explain.classList.add('show');
    const tag = isCorrect
      ? `<span class="tag correct">答對了</span>`
      : selectedValue === -1
        ? `<span class="tag wrong">未作答</span>`
        : `<span class="tag wrong">答錯了，正確答案是 ${letters[q.answer]}</span>`;
    explain.innerHTML = `${tag}<div>${q.explain}</div>`;
  });

  scoreBox.style.display = 'block';
  scoreBox.textContent = `得分：${correctCount} / ${questions.length}${allAnswered ? '' : '（尚有題目未作答）'}`;

  submitBtn.style.display = 'none';
  retryBtn.style.display = 'inline-block';
}

submitBtn.addEventListener('click', grade);
retryBtn.addEventListener('click', () => {
  scoreBox.style.display = 'none';
  submitBtn.style.display = 'inline-block';
  retryBtn.style.display = 'none';
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

render();
</script>
</body>
</html>
