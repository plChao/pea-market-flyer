<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python 程式試讀猜題</title>
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1f2430;
    --muted: #6b7280;
    --border: #e3e5ea;
    --primary: #3b5bdb;
    --primary-dark: #2f4bc0;
    --correct: #2f9e44;
    --correct-bg: #ebfbee;
    --wrong: #e03131;
    --wrong-bg: #fff0f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 24px 16px 80px;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
  }
  header {
    text-align: center;
    margin-bottom: 28px;
  }
  header .logo {
    width: 48px;
    height: 48px;
    border-radius: 10px;
    vertical-align: middle;
    margin-right: 8px;
    object-fit: cover;
  }
  header h1 {
    font-size: 1.6rem;
    margin: 0 0 6px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .option .console {
    display: block;
    font-family: "SFMono-Regular", Consolas, Menlo, monospace;
    font-size: 0.88em;
    line-height: 1.4;
    background: rgba(0,0,0,0.06);
    padding: 4px 8px;
    border-radius: 4px;
    margin-top: 2px;
  }
  header p {
    color: var(--muted);
    margin: 0;
    font-size: 0.95rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
    margin-bottom: 18px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .q-title {
    font-weight: 600;
    margin-bottom: 4px;
    display: flex;
    gap: 8px;
    align-items: baseline;
  }
  .q-num {
    color: var(--primary);
    font-weight: 700;
    flex-shrink: 0;
  }
  pre.code {
    background: #282c34;
    padding: 12px 14px;
    border-radius: 8px;
    overflow-x: auto;
    font-size: 0.88rem;
    margin: 10px 0 14px;
  }
  pre.code code {
    font-family: "SFMono-Regular", Consolas, Menlo, monospace;
    white-space: pre;
    background: transparent;
    padding: 0;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    font-size: 0.95rem;
  }
  .option:hover {
    border-color: var(--primary);
  }
  .option input {
    margin-top: 3px;
    flex-shrink: 0;
  }
  .option.selected {
    border-color: var(--primary);
    background: #eef1ff;
  }
  .option.correct {
    border-color: var(--correct);
    background: var(--correct-bg);
  }
  .option.wrong {
    border-color: var(--wrong);
    background: var(--wrong-bg);
  }
  .option code {
    background: rgba(0,0,0,0.06);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 0.88em;
  }
  .explain {
    display: none;
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 8px;
    background: #f8f9fb;
    border: 1px dashed var(--border);
    font-size: 0.92rem;
  }
  .explain.show { display: block; }
  .explain .tag {
    display: inline-block;
    font-size: 0.78rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 20px;
    margin-bottom: 8px;
  }
  .explain .tag.correct { background: var(--correct-bg); color: var(--correct); }
  .explain .tag.wrong { background: var(--wrong-bg); color: var(--wrong); }
  fieldset { border: none; padding: 0; margin: 0; }

  .actions {
    position: sticky;
    bottom: 16px;
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 20px;
  }
  button {
    font-size: 1rem;
    font-weight: 600;
    padding: 12px 28px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(59,91,219,0.3);
  }
  #submitBtn {
    background: var(--primary);
    color: #fff;
  }
  #submitBtn:hover { background: var(--primary-dark); }
  #retryBtn {
    background: #fff;
    color: var(--primary);
    border: 1px solid var(--primary);
    display: none;
    box-shadow: none;
  }
  #score {
    display: none;
    text-align: center;
    font-size: 1.15rem;
    font-weight: 700;
    margin: 0 0 18px;
    padding: 14px;
    border-radius: 10px;
    background: #eef1ff;
    color: var(--primary-dark);
  }
  .promo {
    display: none;
    text-align: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px;
    margin-top: 24px;
    margin-bottom: 28px;
  }
  .promo.show { display: block; }
  .promo-title {
    font-weight: 700;
    font-size: 1.05rem;
    margin: 0 0 14px;
  }
  .promo-sub {
    color: var(--muted);
    font-size: 0.88rem;
    margin: 18px 0 10px;
  }
  .promo-social {
    display: flex;
    justify-content: center;
    gap: 10px;
  }
  .promo-btn {
    display: inline-block;
    text-decoration: none;
    font-weight: 700;
    font-size: 0.92rem;
    padding: 10px 22px;
    border-radius: 999px;
    color: #fff;
    transition: opacity .15s;
  }
  .promo-btn:hover { opacity: 0.88; }
  .promo-line { background: #06c755; }
  .promo-threads { background: #000000; }
  .promo-ig {
    background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 32px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><img class="logo" src="assets/icon.png" alt="豌豆程式">豌豆程式 x Python 程式試讀猜題</h1>
    <p>共 9 題單選題，作答完畢後按「送出答案」查看詳解</p>
  </header>

  <div id="score"></div>

  <div id="promo" class="promo">
    <p class="promo-title">🎁 限時免費加碼領取「初級 / 中級實作題重點整理」</p>
    <a class="promo-btn promo-line" href="https://line.me/R/ti/p/@597ugdlr" target="_blank" rel="noopener">加 LINE 好友領取</a>
    <p class="promo-sub">追蹤我們獲取更多學習資源</p>
    <div class="promo-social">
      <a class="promo-btn promo-threads" href="https://www.threads.com/@pea_programming" target="_blank" rel="noopener">Threads</a>
      <a class="promo-btn promo-ig" href="https://www.instagram.com/pea_programming/" target="_blank" rel="noopener">Instagram</a>
    </div>
  </div>

  <form id="quizForm"></form>

  <div class="actions">
    <button type="button" id="submitBtn">送出答案</button>
    <button type="button" id="retryBtn">重新作答</button>
  </div>

  <footer>豌豆APCS程式教育</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
<script>
const questions = [
  {
    title: "以下程式的執行結果為何？",
    code: `print(not True or False and True)`,
    options: ["True", "None", "False", "SyntaxError"],
    answer: 2,
    explain: `Python 運算子優先順序：<code>not</code> &gt; <code>and</code> &gt; <code>or</code>。<br>
      先算 <code>not True</code> → <code>False</code>；<br>
      再算 <code>False and True</code> → <code>False</code>（<code>and</code> 比 <code>or</code> 優先結合）；<br>
      最後 <code>False or False</code> → <code>False</code>。`
  },
  {
    title: "以下程式的執行結果為何？",
    code: `print(-7 // 2, -7 % 2)`,
    options: ["-3 -1", "-3 1", "-4 -1", "-4 1"],
    answer: 3,
    explain: `重點：只要「除數」是正的，Python 的 <code>%</code> 餘數結果「永遠是正的」（不會是負數）。<br>
      這跟 C/Java 不一樣——那些語言的餘數符號會跟著「被除數」走，例如 C 語言 <code>-7 % 2</code> 會得到 <code>-1</code>。<br>
      Python 的規則是：餘數符號永遠跟「除數」一致。這裡除數 <code>2</code> 是正的，所以餘數只能是 <code>0</code> 或 <code>1</code>，絕不會是負數。<br>
      驗算：<code>-7 // 2 = -4</code>（向負無窮取整，不是無條件捨去），再用 <code>a - (a // b) * b</code> 算餘數：<code>-7 - (-4 * 2) = -7 + 8 = 1</code>，所以 <code>-7 % 2 = 1</code>。`
  },
  {
    title: "以下程式的執行結果的型態為何？",
    code: `x = 4 / 2\nprint(type(x))`,
    options: ["&lt;class 'int'&gt;", "&lt;class 'float'&gt;", "&lt;class 'str'&gt;", "TypeError"],
    answer: 1,
    explain: `在 Python 3 中，<code>/</code>（真除法）不論是否整除，結果一律是 <code>float</code>。<br>
      例如 <code>4 / 2 = 2.0</code>，而不是 <code>2</code>。<br>
      如果要得到 <code>int</code> 結果，需使用整數除法 <code>//</code>（例如 <code>4 // 2 = 2</code>）。`
  },
  {
    title: "以下程式依序印出的結果為何？",
    code: `x = 1

def change():
    x = 2

def change_global():
    global x
    x = 2

change()
print(x, end=' ')
change_global()
print(x, end=' ')`,
    options: ["1 1", "2 2", "1 2", "2 1"],
    answer: 2,
    explain: `<code>change()</code> 內的 <code>x = 2</code> 會建立一個「區域變數」x，不會影響全域的 x，所以呼叫後第一個 <code>print(x)</code> 仍是 <code>1</code>。<br>
      <code>change_global()</code> 內宣告了 <code>global x</code>，表示要修改的是全域變數 x，所以呼叫後第二個 <code>print(x)</code> 變成 <code>2</code>。<br>
      注意：<code>print()</code> 預設結尾是換行（<code>end='\\n'</code>），這裡把它改成 <code>end=' '</code>，代表印完後面接一個空格而不是換行，所以兩次 <code>print(x)</code> 的結果會印在「同一行」，中間用空格隔開。<br>
      因此輸出依序為 <code>1</code> 和 <code>2</code>，畫面上顯示為一行 <code>1 2</code>。`
  },
  {
    title: "以下程式執行後，a 的值為何？",
    code: `def modify(n):
    n = n + 1
    return n

a = 5
modify(a)
print(a)`,
    options: ["5", "6", "None", "Error"],
    answer: 0,
    explain: `<code>int</code> 是不可變（immutable）型態。<br>
      呼叫 <code>modify(a)</code> 時，參數 n 只是綁定到 a 目前的值 <code>5</code>；<br>
      函式內 <code>n = n + 1</code> 只是讓 n 這個名字重新指向一個新的整數物件 <code>6</code>，並不會改變外部變數 a 所指向的物件。<br>
      因此外部的 <code>a</code> 仍然是 <code>5</code>。`
  },
  {
    title: "以下程式執行後，a 的值為何？",
    code: `def modify(lst):
    lst[0] = 99

a = [1, 2, 3]
modify(a)
print(a)`,
    options: ["[1, 2, 3]", "[99, 2, 3]", "[1, 2, 99]", "Error"],
    answer: 1,
    explain: `<code>list</code> 是可變（mutable）型態。<br>
      呼叫 <code>modify(a)</code> 時，參數 lst 綁定到與 a 「相同」的 list 物件（傳的是參考，不是複製一份）。<br>
      函式內 <code>lst[0] = 99</code> 是直接修改該物件索引 0 的內容，屬於「就地修改」，不是把 lst 重新指向新物件，所以外部的 a 也會被改變。<br>
      因此結果為 <code>[99, 2, 3]</code>。<br><br>
      <b>常見型態的可變（mutable）／不可變（immutable）整理：</b><br>
      可變：<code>list</code>、<code>dict</code>、<code>set</code><br>
      不可變：<code>int</code>、<code>float</code>、<code>bool</code>、<code>str</code>、<code>tuple</code><br>
      傳入函式時，不可變型態的參數在函式內重新賦值不會影響外部變數；可變型態若在函式內「就地修改」（如 <code>lst[i]=</code>、<code>.append()</code>、<code>.sort()</code>），則會影響外部變數。`
  },
  {
    title: "若使用者輸入 6，以下程式的輸出為何？",
    code: `n = input()
print(n * 3)`,
    options: ["18", "216", "TypeError", "666"],
    answer: 3,
    explain: `<code>input()</code> 的回傳值一律是「字串（str）」型態，即使使用者輸入的是數字字元。<br>
      所以 <code>n</code> 其實是字串 <code>'6'</code>，而字串乘以整數會重複該字串。<br>
      <code>'6' * 3</code> 結果是字串 <code>'666'</code>，<code>print</code> 印出時不會顯示引號，畫面上會看到 <code>666</code>。`
  },
  {
    title: "以下程式的執行結果為何？",
    code: `s = "Christmas"
print(s[1:4])`,
    options: ["'Chri'", "'ris'", "'hri'", "'hris'"],
    answer: 2,
    explain: `字串索引從 0 開始：<code>C(0) h(1) r(2) i(3) s(4) t(5) m(6) a(7) s(8)</code>。<br>
      切片語法 <code>[start:stop]</code> 的規則是「包含 start，不包含 stop」，長度剛好是 <code>stop - start</code>。<br>
      <code>s[1:4]</code> 表示從索引 1 取到索引 3（因為 4 不包含），也就是 <code>h, r, i</code> 三個字元。<br>
      因此結果是 <code>'hri'</code>，長度為 <code>4 - 1 = 3</code>。`
  },
  {
    title: "以下程式的執行結果為何？",
    code: `s = "Christmas"
print(s[2:-3])`,
    options: ["'rist'", "'ristm'", "'ris'", "'istma'"],
    answer: 0,
    explain: `負數索引代表「從字串尾端數回來」：<code>-1</code> 是最後一個字元，<code>-2</code> 是倒數第二個，以此類推。<br>
      <code>s = "Christmas"</code> 長度為 9，索引對照：<code>C(0) h(1) r(2) i(3) s(4) t(5) m(6) a(7) s(8)</code>，也可以寫成 <code>C(-9) h(-8) r(-7) i(-6) s(-5) t(-4) m(-3) a(-2) s(-1)</code>。<br>
      所以 <code>-3</code> 對應的是索引 6（字元 <code>m</code>），跟切片一樣「包含 start，不包含 stop」，所以 <code>s[2:-3]</code> 是從索引 2 取到索引 5（不含索引 6），也就是 <code>r, i, s, t</code>。<br>
      因此結果是 <code>'rist'</code>。負數索引和正數索引可以混用，重點是先換算成實際的正數索引位置，再套用「包含 start、不包含 stop」的規則。`
  }
];

const form = document.getElementById('quizForm');
const scoreBox = document.getElementById('score');
const submitBtn = document.getElementById('submitBtn');
const retryBtn = document.getElementById('retryBtn');
const promo = document.getElementById('promo');
const letters = ['A', 'B', 'C', 'D'];

function render() {
  form.innerHTML = '';
  questions.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.qi = qi;

    const titleDiv = document.createElement('div');
    titleDiv.className = 'q-title';
    titleDiv.innerHTML = `<span class="q-num">Q${qi + 1}.</span><span>${q.title}</span>`;
    card.appendChild(titleDiv);

    if (q.code) {
      const pre = document.createElement('pre');
      pre.className = 'code';
      const codeEl = document.createElement('code');
      codeEl.className = 'language-python';
      codeEl.textContent = q.code;
      pre.appendChild(codeEl);
      card.appendChild(pre);
      if (window.hljs) hljs.highlightElement(codeEl);
    }

    const fieldset = document.createElement('fieldset');
    fieldset.className = 'options';
    q.options.forEach((opt, oi) => {
      const label = document.createElement('label');
      label.className = 'option';
      const optHtml = opt.includes('\n')
        ? `<span class="console">${opt.split('\n').join('<br>')}</span>`
        : opt;
      label.innerHTML = `<input type="radio" name="q${qi}" value="${oi}">
        <span>${letters[oi]}. ${optHtml}</span>`;
      fieldset.appendChild(label);
    });
    card.appendChild(fieldset);

    const explain = document.createElement('div');
    explain.className = 'explain';
    explain.dataset.qi = qi;
    card.appendChild(explain);

    form.appendChild(card);
  });
}

function grade() {
  let correctCount = 0;
  let allAnswered = true;

  questions.forEach((q, qi) => {
    const selected = form.querySelector(`input[name="q${qi}"]:checked`);
    const card = form.querySelector(`.card[data-qi="${qi}"]`);
    const labels = card.querySelectorAll('.option');
    const explain = card.querySelector('.explain');

    if (!selected) {
      allAnswered = false;
    }

    const selectedValue = selected ? parseInt(selected.value, 10) : -1;
    const isCorrect = selectedValue === q.answer;
    if (isCorrect) correctCount++;

    labels.forEach((label, oi) => {
      label.querySelector('input').disabled = true;
      if (oi === q.answer) {
        label.classList.add('correct');
      } else if (oi === selectedValue) {
        label.classList.add('wrong');
      }
    });

    explain.classList.add('show');
    const tag = isCorrect
      ? `<span class="tag correct">答對了</span>`
      : selectedValue === -1
        ? `<span class="tag wrong">未作答</span>`
        : `<span class="tag wrong">答錯了，正確答案是 ${letters[q.answer]}</span>`;
    explain.innerHTML = `${tag}<div>${q.explain}</div>`;
  });

  scoreBox.style.display = 'block';
  scoreBox.textContent = `得分：${correctCount} / ${questions.length}${allAnswered ? '' : '（尚有題目未作答）'}`;

  submitBtn.style.display = 'none';
  retryBtn.style.display = 'inline-block';
  promo.classList.add('show');
}

submitBtn.addEventListener('click', grade);
retryBtn.addEventListener('click', () => {
  scoreBox.style.display = 'none';
  submitBtn.style.display = 'inline-block';
  retryBtn.style.display = 'none';
  promo.classList.remove('show');
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

render();
</script>
</body>
</html>
